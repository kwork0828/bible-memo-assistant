<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bible Memo Assistant</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div>
      <p class="eyebrow">영어성경 암송 AI 비서</p>
      <h1>Bible Memo Assistant</h1>
      <p class="subtext">암송 일정, 복습 부담, 대화를 한 화면에서 확인합니다.</p>
    </div>
    <div class="api-settings">
      <label for="apiBaseUrl">Backend API</label>
      <div class="inline-row">
        <input id="apiBaseUrl" type="url" placeholder="http://127.0.0.1:8000">
        <button id="saveApiBaseUrl" type="button">저장</button>
      </div>
    </div>
  </header>

  <main>
    <section class="panel" aria-labelledby="summaryTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">학습 현황</p>
          <h2 id="summaryTitle">데이터 요약</h2>
        </div>
        <button id="refreshAll" type="button" class="secondary">새로고침</button>
      </div>
      <div id="summaryCards" class="summary-grid" aria-live="polite"></div>
    </section>

    <section class="two-column">
      <div class="panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Schedule</p>
            <h2>암송 데이터</h2>
          </div>
        </div>

        <form id="dataForm" class="stack-form">
          <input id="editingDataId" type="hidden">
          <label>
            날짜
            <input id="dataDate" type="date" required>
          </label>
          <label>
            총 단어 수
            <input id="dataValue" type="number" min="0" required>
          </label>
          <label>
            memo JSON
            <textarea id="dataMemo" rows="6" placeholder='{"new": [], "review": []}'>{"new": [], "review": []}</textarea>
          </label>
          <div class="inline-row">
            <button id="saveDataButton" type="submit">데이터 추가</button>
            <button id="cancelEditButton" type="button" class="secondary" hidden>수정 취소</button>
          </div>
        </form>

        <div id="dataStatus" class="status" aria-live="polite"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>날짜</th>
                <th>단어 수</th>
                <th>메모</th>
                <th>작업</th>
              </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="panel chat-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">AI Coach</p>
            <h2>암송 비서 채팅</h2>
          </div>
          <button id="newConversation" type="button" class="secondary">새 대화</button>
        </div>

        <div id="chatMessages" class="chat-messages" aria-live="polite"></div>
        <div id="chatStatus" class="status" aria-live="polite"></div>

        <form id="chatForm" class="chat-form">
          <textarea id="chatInput" rows="3" required placeholder="예: 이번 주 암송 부담을 요약해줘"></textarea>
          <button id="sendChatButton" type="submit">보내기</button>
        </form>
      </div>
    </section>

    <section class="panel" aria-labelledby="conversationTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">History</p>
          <h2 id="conversationTitle">이전 대화</h2>
        </div>
      </div>
      <div id="conversationList" class="conversation-list"></div>
    </section>
  </main>

  <footer>
    <p>개발 단계에서는 API 주소와 비밀값을 분리해 관리합니다.</p>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
